<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Americano</title>
    <style>
        body {
            background: linear-gradient(180deg, #1e1e2f, #3a3a51);
            font-family: Arial, sans-serif;
            color: white;
        }
        section {
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            animation: fadeIn 1s;
        }
        .rules { background: linear-gradient(to right, purple, pink); }
        .diffusion { background: linear-gradient(to right, red, coral); }
        .college { background: linear-gradient(to right, blue, cyan); }
        .team { background: linear-gradient(to right, green, aqua); }
        img {
            width: 100%;
            border-radius: 8px;
            transition: transform 0.3s;
        }
        img:hover { transform: scale(1.05); }
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <section class="rules">
        <h2>Rules of Football Americano</h2>
        <p>Details about the rules...</p>
    </section>
    <section class="diffusion">
        <h2>Diffusion</h2>
        <p>Details about diffusion...</p>
    </section>
    <section class="college">
        <h2>College Football</h2>
        <p>Details about college football...</p>
    </section>
    <section class="team">
        <h2>Teams</h2>
        <p>Details about the teams...</p>
    </section>
    <button class="music-player">Play Music</button>
    <script>
        // Add JavaScript functionality for music player
        const playerButton = document.querySelector('.music-player');
        playerButton.addEventListener('click', function() {
            // Code to play music
        });
    </script>
</body>
</html>
